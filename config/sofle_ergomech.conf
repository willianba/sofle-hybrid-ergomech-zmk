# Base display switch. The per-build screen comes from the shields:
# dongle_display on the dongle, nice_view_gem on each half.
# STATUS_SCREEN_CUSTOM is required by both display modules.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Split + radio (matches IDEX-ChungBae ref)
CONFIG_ZMK_MOUSE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# Sleep
CONFIG_ZMK_SLEEP=y
# 15min
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Encoders live on the left half only (see sofle_ergomech_left.conf);
# enabling EC11 globally breaks builds without an encoder node.

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_POINTING=y
# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
#CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
