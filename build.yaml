# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: sofle_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: central_dongle-nice_nano-zmk
  - board: nice_nano//zmk
    shield: sofle_ergomech_left nice_view_adapter nice_view_gem
    artifact-name: sofle_left-nice_nano-zmk
  - board: nice_nano//zmk
    shield: sofle_ergomech_right nice_view_adapter nice_view_gem
    artifact-name: sofle_right-nice_nano-zmk
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano-zmk
